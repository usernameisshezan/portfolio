<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, user-scalable=no">
<title>Miu Miu — demo</title>
<!--
  A web replica of the Miu Miu iOS app for the portfolio. Sizes, colours and motion are taken
  from the Swift views (JoinView, MemoStreamView, MemoCards) for a 393x852 screen.
  Sample data only: nothing is sent anywhere.
  ponytail: join, card stack, heart, compose, mood and send only. History and settings
  drawers, photos, the shared list and nudges are left out; add them if the demo needs them.
-->
<style>
@font-face { font-family: Manrope; font-weight: 400; src: url(fonts/Manrope-Regular.ttf); font-display: swap; }
@font-face { font-family: Manrope; font-weight: 600; src: url(fonts/Manrope-SemiBold.ttf); font-display: swap; }

:root {
  --bg: #fdfaf6; --ink: #2b2a28; --on-ink: #faf6f0;
  --blush: #c4847c; --blush-soft: #f0e0db; --card: #f8f6f4;
  --sec: rgba(43, 42, 40, .5);
  --spring: cubic-bezier(.3, 1.35, .5, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body {
  font: 400 14px/1.3 Manrope, system-ui, sans-serif; color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
[hidden] { display: none !important; }
#app { position: relative; width: 393px; height: 852px; margin: 0 auto; overflow: hidden; background: var(--bg); }

/* status bar + home indicator */
.status { position: absolute; inset: 0 0 auto; height: 59px; z-index: 50; pointer-events: none; font-weight: 600; font-size: 16px; }
.status .time { position: absolute; left: 52px; top: 19px; }
.status .island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; }
.status .batt { position: absolute; right: 36px; top: 23px; width: 25px; height: 12px; border-radius: 4px; background: var(--ink); }
.home { position: absolute; left: 50%; bottom: 8px; z-index: 50; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); pointer-events: none; }
.screen { position: absolute; left: 0; right: 0; top: 59px; height: 759px; }

/* join: drag one circle into the other */
.wordmark { position: absolute; top: 17px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 16px; }
.wordmark i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.wordmark i + i { background: var(--blush); margin: 0 8px 0 -4px; }
.circle {
  position: absolute; left: 70.5px; width: 252px; height: 252px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding-top: 26px; cursor: grab; touch-action: none;
}
.circle.top { top: 44px; background: var(--ink); color: var(--on-ink); transform: translateY(calc(var(--p) * 147px)); }
.circle.bot { top: 463px; background: var(--blush); color: #fff; transform: translateY(calc(var(--p) * -147px)); }
.join.settle .circle { transition: transform .5s var(--spring); }
.circle > * { opacity: calc(1 - clamp(0, (var(--p) - .45) / .4, 1)); }
.circle small { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
.circle.top small { color: rgba(250, 246, 240, .55); }
.circle.bot small { color: rgba(255, 255, 255, .72); }
.circle b { font-size: 26px; font-weight: 600; }
.circle.bot b { letter-spacing: 3px; }
.circle .pad { height: 26px; }
#newCode { height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255, 255, 255, .18); font-weight: 600; font-size: 11px; color: #fff; }
.hint { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; font-size: 13px; color: var(--sec); }

/* the blush glow when a nudge arrives */
.glow { position: absolute; inset: 0; z-index: 35; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(196, 132, 124, .55)); opacity: 0; transition: opacity .6s; }
.glow.on { opacity: 1; }

/* room reveal */
.reveal { position: absolute; inset: 0; z-index: 40; pointer-events: none; display: none; }
.reveal.on { display: block; animation: revFade .5s 1.45s forwards; }
.blob { position: absolute; left: 50%; top: 50%; width: 1040px; height: 1040px; margin: -520px; border-radius: 50%; background: linear-gradient(var(--ink), var(--blush)); transform: scale(.18); }
.reveal.on .blob { animation: blob .6s cubic-bezier(.3, .8, .3, 1) forwards; }
.lbl { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; color: #fff; opacity: 0; }
.lbl small { font-size: 11px; font-weight: 600; letter-spacing: 2px; opacity: .7; }
.lbl b { font-size: 34px; font-weight: 600; letter-spacing: 6px; }
.reveal.on .lbl { animation: lbl 1.2s .25s forwards; }
@keyframes blob { to { transform: scale(1); } }
@keyframes lbl { 0% { opacity: 0; transform: scale(.9); } 30%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes revFade { to { opacity: 0; transform: scale(1.08); } }

/* stream */
.stream { display: flex; flex-direction: column; transform: scale(.92); opacity: 0; transition: transform .6s var(--spring), opacity .4s; }
.stream.in { transform: none; opacity: 1; }
.stream header { position: relative; display: flex; justify-content: space-between; padding: 6px 14px 4px; }
.stream header > span { display: flex; }
.stream header button { width: 42px; height: 42px; display: grid; place-items: center; }
.stream header svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.title { position: absolute; inset: 6px 0 4px; display: grid; place-content: center; justify-items: center; gap: 3px; pointer-events: none; }
.title b { font-size: 15px; font-weight: 600; letter-spacing: 2px; }
.title span { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--sec); }
.title i { width: 6px; height: 6px; border-radius: 50%; background: var(--blush); }
.stage { position: relative; flex: 1; display: grid; place-items: center; }
.deck { position: relative; width: 299px; height: 388px; }
.stream footer { height: 64px; margin-bottom: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--sec); }
.dots { display: flex; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(43, 42, 40, .18); }
.dots i:first-child { width: 18px; background: var(--ink); }

/* cards */
.card {
  position: absolute; inset: 0; padding: 26px; border-radius: 34px;
  display: flex; flex-direction: column; align-items: flex-start;
  box-shadow: 0 12px 22px rgba(0, 0, 0, .14);
  transition: transform .5s var(--spring), opacity .35s, background .3s, color .3s;
  will-change: transform; touch-action: none;
}
.card.drag, .card.noanim { transition: none; }
.card > * { opacity: 0; transition: opacity .25s; }
.card.top > *, .composer > * { opacity: 1; }
.p0 { background: var(--card); color: var(--ink); --pill: var(--blush-soft); --sec2: var(--sec); }
.p1 { background: var(--ink); color: var(--on-ink); --pill: rgba(250, 246, 240, .14); --sec2: rgba(250, 246, 240, .55); }
.p2 { background: var(--blush); color: #fff; --pill: rgba(255, 255, 255, .2); --sec2: rgba(255, 255, 255, .7); }
.pill { padding: 8px 14px; border-radius: 12px; background: var(--pill); font-weight: 600; font-size: 14px; }
.card p { flex: 1; margin-top: 34px; font-weight: 600; letter-spacing: -.6px; line-height: 1.12; }
.row, .meta { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.meta { min-height: 24px; font-size: 12px; color: var(--sec2); }
.meta b { font-size: 20px; transform: scale(0); transition: transform .45s cubic-bezier(.3, 1.8, .5, 1); }
.card.loved .meta b { transform: none; }
.heart { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; font-size: 110px; color: var(--blush); text-shadow: 0 8px 16px rgba(0, 0, 0, .2); pointer-events: none; opacity: 0; }
.heart.pop { animation: heart .9s; }
@keyframes heart { 0% { opacity: 1; transform: scale(.2); } 30% { transform: scale(1.12); } 45%, 60% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.25); } }

/* composer */
.composer { z-index: 20; transform: translateY(120%) scale(.9); opacity: 0; pointer-events: none; }
.composer.show { transform: none; opacity: 1; pointer-events: auto; }
.composer.fly { transform: translateY(-852px) rotate(-7deg) scale(.82); opacity: .2; transition: transform .42s cubic-bezier(.5, 0, .9, .6), opacity .42s; }
textarea {
  flex: 1; width: 100%; margin-top: 14px; padding: 8px 5px 0;
  border: 0; outline: 0; resize: none; background: none;
  font: 600 28px/1.2 Manrope, system-ui, sans-serif; letter-spacing: -.4px; color: inherit; caret-color: var(--blush);
  user-select: text; -webkit-user-select: text;
}
textarea::placeholder { color: var(--sec2); }
#cClose { width: 32px; height: 32px; border-radius: 50%; background: rgba(128, 128, 128, .14); color: var(--sec2); font-weight: 700; font-size: 13px; }
#cnt { font-size: 12px; color: var(--sec2); }
#send { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(var(--ink), var(--blush)); box-shadow: 0 6px 12px rgba(196, 132, 124, .45); transition: transform .35s var(--spring), opacity .2s; }
#send svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#send:disabled { opacity: .35; transform: scale(.9); box-shadow: none; cursor: default; }

/* toast */
.toast {
  position: absolute; top: 6px; left: 50%; z-index: 30;
  display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 20px;
  background: #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, .1);
  font-weight: 600; font-size: 13px; white-space: nowrap; pointer-events: none;
  transform: translate(-50%, -40px) scale(.8); opacity: 0; transition: transform .55s var(--spring), opacity .3s;
}
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.toast i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(var(--ink), var(--blush)); color: #fff; font-style: normal; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div class="status"><span class="time">9:41</span><span class="island"></span><span class="batt"></span></div>

  <section class="screen join" id="join" style="--p:0">
    <div class="wordmark"><i></i><i></i>miu miu</div>
    <div class="circle top" data-dir="1"><small>YOUR NAME</small><b>You</b><span class="pad"></span></div>
    <div class="circle bot" data-dir="-1"><small>ROOM CODE</small><b id="code">MIU214</b><button id="newCode">✦ New code</button></div>
    <p class="hint" id="hint">Drag one circle into the other</p>
  </section>

  <section class="screen stream" id="stream" hidden>
    <header>
      <button aria-label="History"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M9 5v14"/></svg></button>
      <div class="title"><b id="hdrCode"></b><span><i></i>Miu has joined</span></div>
      <span>
        <button aria-label="Shared list"><svg viewBox="0 0 24 24"><path d="M4 7l1.5 1.5L8 6M4 13l1.5 1.5L8 12M4 19l1.5 1.5L8 18M12 7h8M12 13h8M12 19h8"/></svg></button>
        <button aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-width="3" stroke-dasharray="3.4 2.5"/></svg></button>
      </span>
    </header>
    <div class="stage">
      <div class="toast" id="toast"><i>✓</i><span id="toastText"></span></div>
      <div class="deck" id="deck">
        <div class="heart" id="heart">♥</div>
        <div class="card composer p0" id="composer">
          <div class="row"><span class="pill" id="cPill"></span><button id="cClose" aria-label="Close">✕</button></div>
          <textarea id="draft" placeholder="Write a memo…" aria-label="Memo"></textarea>
          <div class="row">
            <span id="cnt"></span>
            <button id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <footer id="foot"></footer>
  </section>

  <div class="glow" id="glow"></div>
  <div class="reveal" id="reveal"><div class="blob"></div><div class="lbl"><small>ROOM</small><b id="revCode"></b></div></div>
  <div class="home"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const join = $('join'), stream = $('stream'), deck = $('deck'), composer = $('composer'), draft = $('draft');

// ---- join ----
let p = 0, jd = null;
const setP = v => {
  p = v;
  join.style.setProperty('--p', v);
  $('hint').textContent = v > .05 ? 'Keep going…' : 'Drag one circle into the other';
};
join.querySelectorAll('.circle').forEach(c => {
  c.onpointerdown = e => {
    if (e.target.id === 'newCode') return;
    c.setPointerCapture(e.pointerId);
    jd = { y: e.clientY, p, dir: +c.dataset.dir };
    join.classList.remove('settle');
  };
  c.onpointermove = e => { if (jd) setP(Math.max(-.04, Math.min(1.04, jd.p + jd.dir * (e.clientY - jd.y) / 147))); };
  c.onpointerup = c.onpointercancel = () => {
    if (!jd) return;
    jd = null;
    join.classList.add('settle');
    if (p > .6) startJoin(); else setP(0);
  };
});
$('newCode').onclick = () => {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  $('code').textContent = Array.from({ length: 6 }, () => abc[Math.random() * abc.length | 0]).join('');
};

let revealTimers = []; // kept so the tour can cancel a reveal that is still playing
function startJoin() {
  join.classList.add('settle');
  setP(1);
  revealTimers = [setTimeout(reveal, 250)];
}
function reveal() {
  $('revCode').textContent = $('hdrCode').textContent = $('code').textContent;
  $('reveal').classList.add('on');
  revealTimers = [
    setTimeout(() => {
      join.hidden = true;
      stream.hidden = false;
      layout();
      requestAnimationFrame(() => stream.classList.add('in'));
    }, 1450),
    setTimeout(() => $('reveal').classList.remove('on'), 2000),
  ];
}

// ---- memo stack ----
const ANG = [0, -5, 6, -9], OFF = [0, 10, 20, 28], SCALE = [1, .965, .93, .9];
const REPLIES = ['Got it. See you at 8 ♥', 'Ha! Tell me everything later.', 'Okay. Bring an umbrella ☔'];
const MOODS = ['', 'Calm', 'Warm', 'Deep'], MOOD_PALETTE = [0, 0, 2, 1];
const now = () => new Date().toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
let made = 0, replies = 0, manual = false, mood = 0, drag = null, lastTap = 0, toastTimer;

function makeCard(text, time) {
  const el = document.createElement('div');
  el.className = 'card p' + made++ % 3;
  const n = text.length, size = n < 40 ? 40 : n < 90 ? 33 : n < 160 ? 27 : 21;
  el.innerHTML = `<span class="pill">Miu</span><p style="font-size:${size}px"></p><div class="meta"><span></span><b>❤️</b></div>`;
  el.querySelector('p').textContent = text;
  el.querySelector('.meta span').textContent = time || now();
  deck.append(el);
  return el;
}
const queue = [
  makeCard('Landed! The flight was fine, stop worrying.', 'Tue 9:12 AM'),
  makeCard('Saved you the last slice 🍕', 'Tue 9:30 AM'),
  makeCard("Call me when you're free?", 'Tue 9:38 AM'),
];
const composing = () => manual || !queue.length;

function layout() {
  const c = composing(), n = queue.length;
  queue.forEach((el, d) => {
    el.style.display = d > 3 ? 'none' : '';
    if (d > 3) return;
    el.style.zIndex = 10 - d;
    el.classList.toggle('top', d === 0);
    el.style.opacity = c ? .55 : 1;
    el.style.transform = `translateY(${OFF[d] + (c ? 26 : 0)}px) rotate(${ANG[d]}deg) scale(${SCALE[d] * (c ? .9 : 1)})`;
  });
  composer.classList.toggle('show', c);
  composer.classList.remove('p0', 'p1', 'p2');
  composer.classList.add('p' + MOOD_PALETTE[mood]);
  $('cPill').textContent = mood ? MOODS[mood] : n ? 'New memo' : 'All caught up';
  $('cClose').hidden = !n;
  $('cnt').textContent = draft.value ? draft.value.length : '← → mood';
  $('send').disabled = !draft.value.trim();
  const memos = n === 1 ? '1 new memo' : n + ' new memos';
  $('foot').innerHTML = !c
    ? `<div class="dots">${'<i></i>'.repeat(Math.min(n, 6))}</div><span>${memos} · swipe to clear</span>`
    : n ? `<span>${memos} waiting</span>` : '<span>All caught up · write one back</span>';
}

deck.addEventListener('pointerdown', e => {
  const el = e.target.closest('.card.top');
  if (!el || composing()) return;
  el.setPointerCapture(e.pointerId);
  el.classList.add('drag');
  drag = { el, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
});
deck.addEventListener('pointermove', e => {
  if (!drag) return;
  let dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const vertical = Math.abs(dy) > Math.abs(dx);
  if (dy > 0 && vertical) dy *= .25; // pulling down resists
  drag.dx = dx; drag.dy = dy;
  drag.el.style.transform = `translate(${dx}px, ${dy * (vertical ? .45 : .2)}px) rotate(${dx / 22}deg)`;
});
function endDrag() {
  if (!drag) return;
  const { el, dx, dy } = drag;
  drag = null;
  el.classList.remove('drag');
  const horizontal = Math.abs(dx) > Math.abs(dy);
  if (horizontal && Math.abs(dx) > 90) return dismiss(el, Math.sign(dx), dy);
  if (!horizontal && dy < -80) manual = true, setTimeout(() => draft.focus(), 300);
  else if (Math.abs(dx) + Math.abs(dy) < 6) tap(el);
  layout();
}
deck.addEventListener('pointerup', endDrag);
deck.addEventListener('pointercancel', endDrag);

function dismiss(el, dir, dy) {
  el.style.transition = 'transform .3s ease-out';
  el.style.transform = `translate(${dir * 720}px, ${dy * .2 + 80}px) rotate(${dir * 30}deg)`;
  // promote the next card while this one is still leaving, so there is never an empty beat
  setTimeout(() => { queue.splice(queue.indexOf(el), 1); layout(); }, 135);
  setTimeout(() => el.remove(), 500);
}

// double-tap to heart
function tap(el) {
  const t = performance.now();
  if (t - lastTap > 320) { lastTap = t; return; }
  lastTap = 0;
  if (!el.classList.toggle('loved')) return;
  $('heart').classList.remove('pop');
  void $('heart').offsetWidth;
  $('heart').classList.add('pop');
}

function arrive() {
  const el = makeCard(REPLIES[replies++ % REPLIES.length]);
  el.classList.add('noanim');
  el.style.opacity = 0;
  el.style.transform = 'translateY(-520px) rotate(-14deg) scale(.86)';
  void el.offsetWidth;
  el.classList.remove('noanim');
  queue.push(el);
  layout();
}

// ---- composer ----
draft.oninput = () => { if (draft.value) manual = true; layout(); };
$('cClose').onclick = () => { manual = false; draft.blur(); layout(); };
let cx = null;
composer.addEventListener('pointerdown', e => { cx = e.clientX; });
composer.addEventListener('pointerup', e => {
  const dx = e.clientX - cx;
  cx = null;
  if (Math.abs(dx) < 60 || draft.selectionStart !== draft.selectionEnd) return;
  mood = (mood + (dx > 0 ? 1 : 3)) % 4; // sideways swipe cycles the mood tint
  layout();
});
$('send').onclick = () => {
  if (!draft.value.trim()) return;
  composer.classList.add('fly');
  setTimeout(() => {
    composer.classList.add('noanim');
    composer.classList.remove('fly', 'show');
    draft.value = '';
    draft.blur();
    mood = 0;
    manual = false;
    void composer.offsetWidth;
    composer.classList.remove('noanim');
    layout();
    toast('Sent · saved to history');
    setTimeout(arrive, 1900); // the demo partner writes back
  }, 420);
};

function toast(text, icon = '✓') {
  $('toast').firstElementChild.textContent = icon;
  $('toastText').textContent = text;
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), 1800);
}
stream.querySelectorAll('header button').forEach(b => { b.onclick = () => toast('Not part of this demo'); });

// ---- guided tour: the project page says which moment to show as its callouts scroll past ----
function stopReveal() { revealTimers.forEach(clearTimeout); $('reveal').classList.remove('on'); }
function enter() { // straight into the room, with a few memos waiting
  stopReveal();
  $('hdrCode').textContent = $('code').textContent;
  join.hidden = true;
  stream.hidden = false;
  stream.classList.add('in');
  manual = false; mood = 0; draft.value = '';
  while (queue.length < 3) queue.push(makeCard(REPLIES[replies++ % REPLIES.length]));
  layout();
}
const tour = {
  join() { stopReveal(); stream.hidden = true; stream.classList.remove('in'); join.hidden = false; join.classList.add('settle'); setP(0); },
  room() { if (join.hidden) enter(); else startJoin(); },
  swipe() { enter(); setTimeout(() => { if (!drag && !composing() && queue.length > 1) dismiss(queue[0], 1, 0); }, 500); },
  mood() { enter(); manual = true; mood = 2; layout(); },
  nudge() {
    enter();
    $('glow').classList.add('on');
    setTimeout(() => $('glow').classList.remove('on'), 1800);
    toast('Miu is thinking of you', '♥');
  },
  stream: enter,
};
addEventListener('message', e => { if (e.source === parent && tour[e.data?.show]) tour[e.data.show](); });
</script>
</body>
</html>
